<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* LuxuryCon brand: forest green #0D2A1A, gold #C9A227 */
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: radial-gradient(120% 120% at 50% 30%, #123522 0%, #0D2A1A 70%);
        color: #C9A227; font-family: system-ui, "Segoe UI", sans-serif;
        display: flex; align-items: center; justify-content: center; user-select: none;
      }
      .wrap { text-align: center; }
      .mono {
        width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 18px;
        background: #0D2A1A; border: 2px solid #C9A227;
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 34px; letter-spacing: .02em; color: #C9A227;
      }
      .title { font-size: 26px; font-weight: 700; letter-spacing: .12em; }
      .sub { margin-top: 6px; font-size: 12px; opacity: .65; color: #e6d9a8; letter-spacing: .08em; }
      .barwrap { width: 240px; height: 6px; margin: 22px auto 0; background: rgba(201,162,39,.18);
                 border-radius: 999px; overflow: hidden; }
      .bar { height: 100%; width: 30%; background: #C9A227; border-radius: 999px;
             animation: slide 1.2s ease-in-out infinite; }
      @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
      .status { margin-top: 12px; font-size: 11px; opacity: .55; color: #e6d9a8; min-height: 14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- AF-PKG-005 swaps this monogram for the LuxuryCon logo asset. -->
      <div class="mono">AF</div>
      <div class="title">AquaFlow Studio</div>
      <div class="sub">LUXURYCON</div>
      <div class="barwrap"><div class="bar"></div></div>
      <div class="status" id="status">Starting engine…</div>
    </div>
    <script>
      // The main process updates this via IPC-free title channel (executeJavaScript).
      window.setSplashStatus = (t) => { document.getElementById("status").textContent = t; };
    </script>
  </body>
</html>
