# AquaFlow Studio — electron-builder configuration (AF-PKG-001 skeleton).
# Fleshed out across AF-PKG-005 (branding), 006 (.aquashow), 007 (auto-update), 008 (NSIS).
appId: com.luxurycon.aquaflow
productName: AquaFlow Studio
copyright: Copyright © 2026 LuxuryCon

directories:
  output: dist
  buildResources: build   # icons + installer graphics live here (added in AF-PKG-005)

# Files packed into the app (added incrementally):
#   web/            — the Vite production build (AF-PKG-003)
#   resources/engine/aquaflow-engine.exe — the PyInstaller backend bundle (AF-PKG-002)
files:
  - main.js
  - preload.js
  - launcher.js
  - app-config.js
  - menu.js
  - updater.js
  - ui-server.js
  - cad-native.js
  - project-files.js       # AF-NEXT-006 atomic save / snapshots / crash detection
  - open-queue.js          # holds launch/second-instance opens until the renderer is ready
  - render-export.js       # AF-3D-VID-002 PNG-sequence folder export
  - splash.html
  - "assets/**/*"           # icon.png, shield.png, splash.png (runtime), *.ico
  - "web/**/*"
  - package.json
  - "!**/*.map"

# Audit F3: the ui-server streams web/ with plain node fs, which cannot be trusted to read
# files inside app.asar. Unpack web/ to app.asar.unpacked so it exists as real files on disk
# (main.js resolveWebRoot() prefers that path).
asarUnpack:
  - "web/**"

extraResources:
  # 1.2.29 engine (S7-1500/ET 200SP, stable v2 license fingerprint + legacy per-adapter acceptance): Siemens device model, hardware catalog, TIA tag tables and acceptance
  # runner. Checked before switching: packaged smoke test PASS, acceptance over S7 against
  # the FB twin PASS, and every saved site keeps its program signature (0x6A3198F3 and
  # 0x4794E8BA unchanged). The pre-1.2.16 engine stays in resources/ for rollback.
  # 1.2.33 engine: same-revision backend for the AF-NEXT release (including honest
  # per-controller verification labels). Packaged smoke must pass before installation.
  # engine-1.2.32 stays available through the prior installer for rollback.
  # 1.2.37 engine: keyed (keyframe) clips in show_frame, preflight and the Siemens compilers.
  # Packaged smoke: /api/health 200 before installation. engine-1.2.33 stays for rollback.
  - from: resources/engine-1.2.37
    to: engine
    filter: ["**/*"]
  # Bundled license secret (+ update URL). resolveConfig() reads this from
  # <resourcesPath>/app-config.json so employee machines without the AQUAFLOW_LICENSE_SECRET
  # env var can start the engine and validate licenses. This file is gitignored and MUST exist
  # locally before a distributable build (see LICENSE-ADMIN.md / resources/app-config.example.json).
  - from: resources/app-config.json
    to: app-config.json

# Windows target (Tier A = Windows only).
win:
  target:
    - nsis
  icon: build/AquaFlow.ico          # multi-size app icon (shield + water) from generate_brand_assets.py

# AF-PKG-006 — .aquashow file association. Double-clicking a show launches AquaFlow with
# the file path in argv (handled in main.js). Uses a dedicated document icon (shield + water
# + document fold) from generate_brand_assets.py.
fileAssociations:
  - ext: aquashow
    name: AquaFlow Show
    description: AquaFlow fountain show
    role: Editor
    icon: build/aquashow.ico

# AF-PKG-008 — NSIS installer.
# Default = per-user (no admin prompt), the smoother path for Tier A internal rollout.
# CEO DECISION PENDING: to install into "C:\Program Files\LuxuryCon\AquaFlow Studio"
# system-wide instead, flip `perMachine: true` (installer will then request elevation).
nsis:
  oneClick: false                        # assisted installer (welcome/dir/progress/finish)
  perMachine: false                      # per-user by default; see note above
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: LuxuryCon                 # group Start-menu shortcut under a LuxuryCon folder
  shortcutName: AquaFlow Studio
  runAfterFinish: true
  # Upgrades reinstall in place; user data lives in %APPDATA%\AquaFlow Studio and is NOT
  # removed on uninstall/upgrade, so shows/settings survive.
  deleteAppDataOnUninstall: false
  # Branded installer graphics from generate_brand_assets.py (placeholder LuxuryCon shield
  # artwork — CEO can supply higher-res finals and re-run the script).
  installerIcon: build/AquaFlow.ico
  uninstallerIcon: build/AquaFlow.ico
  installerHeaderIcon: build/AquaFlow.ico
  installerHeader: build/installerHeader.bmp     # 150x57 BMP
  installerSidebar: build/installerSidebar.bmp   # 164x314 BMP
  uninstallerSidebar: build/installerSidebar.bmp
artifactName: AquaFlowSetup-${version}.${ext}

# AF-PKG-007 — auto-update feed. `publish` makes electron-builder emit latest.yml
# (with sha512 checksums) next to the installer so electron-updater can verify downloads.
# This URL is only the DEFAULT baked into the build; the running app reads its feed URL
# from AQUAFLOW_UPDATE_URL / bundled app-config.json (admin-only — see updater.js), which
# is the MITM guard. Serve the feed over HTTPS. Tier A ships UNSIGNED (no code-signing cert
# purchased — CEO decision); integrity rests on HTTPS transport + the sha512 checksum in
# latest.yml. Code-signing is a Tier B task. See RELEASE.md.
publish:
  - provider: generic
    url: https://luxuryconworld.com/updates/aquaflow/
    channel: latest
