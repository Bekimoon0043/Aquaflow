[pytest]
# AquaFlow backend test suite (AQ-S1-009).
# Tests import backend modules as top-level (schema_adapter, services.*, engine.*)
# exactly as the app does with cwd=backend, so the backend dir is on the path.
testpaths = tests
pythonpath = .
addopts = -q --color=yes
filterwarnings =
    ignore::DeprecationWarning
